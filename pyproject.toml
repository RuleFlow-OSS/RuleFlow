[project]
name = "ruleflow"
version = "0.1.0"
description = "A python framework implementing the Sessie algorithms and Causal Network analysis tools."
requires-python = ">=3.14"
dependencies = [
    "lark>=1.3.1",
    "matplotlib>=3.11.0",
    "networkx>=3.6.1",
    "numpy>=2.4.1",
    "platformdirs>=4.5.1",
    "psutil>=7.2.1",
    "pyvis>=0.3.2",
    "pyyaml>=6.0.3",
    "regex>=2025.11.3",
    "rich>=14.2.0",
    "textual[syntax]>=7.2.0",
]

[dependency-groups]
dev = []
