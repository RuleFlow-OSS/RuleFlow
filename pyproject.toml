[project]
name = "ruleflow"
version = "1.1.4"
description = "A Python research framework and terminal-based IDE (RuleFlow Studio) for modeling, evolving, and analyzing discrete complex systems like ECA and SSS."
readme = "README.md"
requires-python = ">=3.12, <3.15"  # wait to upgrade to latest versions...
dependencies = [
    "networkx",
    "numpy",
    "platformdirs",
    "psutil",
    "pyvis",
    "pyyaml",
    "regex",
    "rich",
    "textual",
    "wcwidth",
    "lark",
    "sqids",
    "pydantic",
    "wolframclient"
]

[project.optional-dependencies]
optional = [
    "numba",
]

[project.urls]
Homepage = "https://ruleflow.org"
Documentation = "https://www.ruleflow.org/get-started/overview/"
Repository = "https://github.com/RuleFlow-OSS/RuleFlow"
Issues = "https://github.com/RuleFlow-OSS/RuleFlow/issues"

[project.scripts]
studio = "ruleflow.studio.view:run_studio_app"

[build-system]
requires = ["uv_build>=0.13.4,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
source-include = ["src/ruleflow/studio/*.tcss"]
